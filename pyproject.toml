[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qqfetch"
version = "0.1.0"
description = "QQ 空间说说数据抓取工具(扫码登录、无痕抓取)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg>=3.2",
    "tomli>=2.0 ; python_version < '3.11'",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# ascii 模式二维码渲染需要 Pillow,非首期必需
ascii = ["pillow>=10"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
qqfetch = "qqfetch.cli:main"

[tool.setuptools.packages.find]
include = ["qqfetch*"]

[tool.setuptools.package-data]
"qqfetch.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
